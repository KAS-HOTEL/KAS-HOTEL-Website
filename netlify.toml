# Fallback host if Vercel is unavailable. Same static output, same clean URLs.
[build]
  command = "npm run build"
  publish = "."

[[redirects]]
  from = "/hotels"
  to = "/hotels.html"
  status = 200
[[redirects]]
  from = "/hotel-detail"
  to = "/hotel-detail.html"
  status = 200
[[redirects]]
  from = "/room-detail"
  to = "/room-detail.html"
  status = 200
[[redirects]]
  from = "/guest-details"
  to = "/guest-details.html"
  status = 200
[[redirects]]
  from = "/review-confirm"
  to = "/review-confirm.html"
  status = 200
[[redirects]]
  from = "/booking-confirmed"
  to = "/booking-confirmed.html"
  status = 200
[[redirects]]
  from = "/manage-booking"
  to = "/manage-booking.html"
  status = 200
