<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking Request — KAS Hotel Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header id="hdr"></header>
<div class="container"><nav class="crumb" id="crumb"></nav></div>
<div id="steps"></div>

<section class="section section--tight">
  <div class="container">
    <div class="split">
      <div class="split__main" id="main"></div>
      <aside class="split__side"><div class="sticky stack" style="gap:16px" id="side"></div></aside>
    </div>
  </div>
</section>

<div id="trustStrip"></div>
<footer id="ftr"></footer>

<script src="js/images.js"></script>
<script src="js/rates.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/contact.js"></script>
<script src="js/i18n.js"></script><script src="js/api-map.js"></script><script src="js/api.js"></script><script src="js/catalog-sync.js"></script><script src="js/app.js"></script>
<script src="js/booking.js"></script><script src="js/request-view.js"></script>
<script src="js/search.js"></script>
<script src="js/hotel.js"></script>
<script src="js/room.js"></script>
<script>
(async function(){
  var U=window.U,S=window.Store,B=window.Booking,App=window.App,V=window.KAS_REQUEST_VIEW;
  App.boot({active:'my kas'});
  var vi=window.KAS_I18N && window.KAS_I18N.getLanguage()==='vi';
  var ref=U.qs().ref || (S.getCurrent() || {}).bookingNumber;
  var booking=ref ? S.getByNumber(ref) : null;
  try {
    var profile=await window.KAS_API.profile();
    var stays=await window.KAS_API.stays(vi?'vi':'en');
    var raw=stays.find(function(stay){return stay.reference===ref;});
    if(raw){booking=V.map(raw,profile);S.saveBooking(booking);}
  } catch (_) { }
  if(!booking || !booking.backend){
    U.$('#main').innerHTML='<div class="empty"><h2>'+(vi?'Chưa tìm thấy yêu cầu':'Request not found')+'</h2><a class="btn btn--gold" href="manage-booking.html">'+(vi?'Đăng nhập để kiểm tra yêu cầu':'Sign in to view your request')+'</a></div>';
  } else {
    if(!booking.live){booking.status='REQUESTED';booking.salesStatus='REQUESTED';booking.stayStatus=null;}
    U.$('#main').innerHTML=V.details(booking,vi);
    U.$('#side').innerHTML='<a class="btn btn--gold btn--block" href="manage-booking.html">'+(vi?'Xem trạng thái mới nhất trong My KAS':'View the latest status in My KAS')+'</a>';
    if(!booking.live) U.$('#side').insertAdjacentHTML('beforeend','<p class="tiny muted">'+(vi?'Đây là biên nhận tại thời điểm gửi. Đăng nhập để xem trạng thái do khách sạn cập nhật.':'This is the submission receipt. Sign in to see the hotel’s latest status.')+'</p>');
  }
  U.$('#steps').innerHTML='';
  U.$('#trustStrip').innerHTML='';
})();
</script>
</body>
</html>
