<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!--
    The KAS mark, as the browser-tab icon. Same geometry as `features/auth/KasMark`
    but with literal colours: a favicon is rendered outside the document, so it
    cannot read the design tokens. `--accent-700` is #243733 and `--gold-500` is
    #b08a45; if either token moves, this file moves with it.

    Next.js App Router picks `src/app/icon.svg` up automatically — before this
    existed every page load logged a 404 for /favicon.ico.
  -->
  <circle cx="20" cy="20" r="20" fill="#243733"/>
  <circle cx="20" cy="20" r="16.5" fill="none" stroke="#b08a45" stroke-width="1" opacity="0.85"/>
  <path d="M20 10.5 L27 17 L24.5 29 L15.5 29 L13 17 Z" fill="#b08a45" opacity="0.92"/>
  <path d="M20 15 L23.2 18 L21.9 25 L18.1 25 L16.8 18 Z" fill="#243733"/>
</svg>
